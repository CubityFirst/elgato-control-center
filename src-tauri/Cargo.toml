[package]
name = "elgato-control-center"
version = "1.0.0"
description = "Minimal tray popover for controlling Elgato Key Lights"
edition = "2021"
license = "MIT"
repository = "https://github.com/CubityFirst/elgato-control-center"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.21"
ureq = { version = "3", features = ["json"] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
